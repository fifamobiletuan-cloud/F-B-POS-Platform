# Cổng chạy Backend Spring Boot (Sử dụng 8085 thông thoáng, không lo bị đụng độ)
server.port=8085

# Tên ứng dụng
spring.application.name=ChouxChin_POS_Backend

# ====================================================================
# CẤU HÌNH KẾT NỐI POSTGRESQL (DÙNG CHO PGADMIN 4)
# ====================================================================
# Tên Database: milktea_pos_db (Tạo trong pgAdmin 4)
spring.datasource.url=jdbc:postgresql://localhost:5432/milktea_pos_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate: Tự động cập nhật bảng khi thực thể thay đổi
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Khởi tạo dữ liệu mẫu nếu bảng rỗng
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Quản lý định dạng ngày giờ JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Hỗ trợ upload ảnh (nếu cần trong tương lai)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
